  <div class="app">
    <header class="topbar">
      <!-- Title comes first so Tab moves from it (focused on each screen change) to the steps. CSS keeps the steps on the left. -->
      <div class="header-end">
        <h1 class="screen-title" id="screen-title" tabindex="-1">Security Dashboard</h1>
        <div class="integrity integrity-danger" id="integrity">
          <span class="integrity-label">Network integrity</span>
          <span class="integrity-bar" aria-hidden="true"><span class="integrity-fill" id="integrity-fill"></span></span>
          <span class="integrity-value" id="integrity-value">0%</span>
          <span class="integrity-status" id="integrity-status">Under attack</span>
        </div>
      </div>
      <nav class="tool-nav" id="tool-nav" aria-label="Threat tools" hidden></nav>
    </header>
    <main class="main" id="main"></main>
  </div>

  <p class="visually-hidden" id="announcer" aria-live="polite"></p>
  <noscript><p class="no-script">This activity needs JavaScript to run.</p></noscript>
